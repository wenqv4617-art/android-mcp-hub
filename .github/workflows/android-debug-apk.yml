# 只做一件事：手动构建一个 Debug APK 并作为构建产物上传。
#
# 能不能碰生产：不能，而且是结构上不能 ——
#   * 只有 workflow_dispatch，push / PR / 定时都不会触发；
#   * 全文没有 secret、没有 Cloudflare 凭据、没有 wrangler、没有任何 deploy 步骤;
#   * permissions 只有 contents: read，连 Release 都发不出去;
#   * 设备令牌从来不进仓库，也不进 APK（运行时才由用户在界面上填）。
#
# ⚠️ 本工作流**从未被执行过**（本地环境没有 GitHub Actions runner）。
#    它属于 TEST_REPORT 里 NOT RUN 的一部分，不是"已验证可用"的产物。
name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # gradle.properties 里那行 aapt2 覆盖是给 arm64 主机用的 qemu 包装脚本，
      # runner 是真 x86_64，必须关掉，否则会去执行一个绝对路径下不存在的脚本。
      - name: 关闭 aarch64 专用的 aapt2 覆盖
        run: |
          sed -i 's|^android\.aapt2FromMavenOverride=.*|# (CI) aapt2 override disabled: x86_64 runner uses the Maven one|' android/gradle.properties
          grep -n aapt2 android/gradle.properties || true

      - name: 单元测试
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: 记录校验值与元信息
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK" | tee sha256.txt
          {
            echo "## Android MCP Hub · Gate 0.1 Debug APK"
            echo
            echo '```'
            sha256sum "$APK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Android-MCP-Hub-Gate0.1-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/sha256.txt
          if-no-files-found: error
          retention-days: 30
