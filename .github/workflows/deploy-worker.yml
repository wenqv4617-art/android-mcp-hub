name: Worker manual deployment

# 手动部署，三条路径（都只能由人来点，且都必须逐字输入确认串）：
#   · gate0                    线上路径：确认串 DEPLOY（与 Gate 1 以来的行为完全一致）
#   · feat/gate2-core          Gate 2 联调临时路径：确认串 DEPLOY-GATE2
#   · feat/gate2-5-native-tools Gate 2.5 联调临时路径：确认串 DEPLOY-GATE2-5
#
# 三条路径共用同一套闸门：先 typecheck / 单测 / 本地 e2e，再 wrangler --dry-run，
# 再校验 Cloudflare 账号与两个 Secret，最后才真正 deploy。
# 没有任何 push / pull_request 触发器 —— 普通推送永远不会部署。
#
# V1.5 追加（仍只在人工确认后执行）：
#   · 从仓库 Secret 注入 `GATEWAY_ANDROID_PAIRING_CODE`（只覆盖这一枚，不动别的 Secret）；
#   · 部署后立即用真实公网地址跑 `tools/gateway-online-smoke.ts`：
#     配对 → 服务管理 → 工具发现 → 未授权拒绝 → 授权 → /mcp 真实调用 →
#     需确认票据 → 停用拒绝 → 坏地址拒绝 → 清理 → 撤销后拒绝。
#   这一步失败会让整次部署运行变红；它不能用 dry-run / 本地 workerd 代替。
#   勾选 verify_only 可跳过部署步骤，只对现有线上部署重复跑这条验收；
#   bench_samples > 0 时额外输出 tools/list 与只读第三方调用的 p50/p90。
#
# ⚠ feat/gate2-core 与 feat/gate2-5-native-tools 这两条路都是**临时**的：真机验证
#   通过、并入 gate0 之后，应当把下面 if 条件里对应的子句、这段说明，以及
#   worker/test/security.test.ts 里对应的那几条约束与反向用例一起删掉
#   （在那之前测试会一直盯着它们）。
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'gate0 填 DEPLOY；feat/gate2-core 填 DEPLOY-GATE2；feat/gate2-5-native-tools 填 DEPLOY-GATE2-5'
        required: true
        type: string
      verify_only:
        description: '只对现有线上部署跑验收，不重新部署（需要配对 Secret 已存在）'
        required: false
        type: boolean
        default: false
      bench_samples:
        description: '线上验收时额外采样 tools/list 与只读第三方调用的次数（0 表示不采样）'
        required: false
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: android-mcp-hub-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.ref == 'refs/heads/gate0' && inputs.confirm_deploy == 'DEPLOY') || (github.ref == 'refs/heads/feat/gate2-core' && inputs.confirm_deploy == 'DEPLOY-GATE2') || (github.ref == 'refs/heads/feat/gate2-5-native-tools' && inputs.confirm_deploy == 'DEPLOY-GATE2-5') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate target and configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/gate0)
              target='gate0'
              ;;
            refs/heads/feat/gate2-core)
              target='feat/gate2-core (Gate 2 联调，临时路径)'
              echo "::warning::Gate 2 临时路径：本次部署的是 feat/gate2-core 上尚未在真机验证过的代码"
              ;;
            refs/heads/feat/gate2-5-native-tools)
              target='feat/gate2-5-native-tools (Gate 2.5 联调，临时路径)'
              echo "::warning::Gate 2.5 临时路径：本次部署的是 feat/gate2-5-native-tools 上尚未在真机验证过的代码"
              ;;
            *)
              echo "::error::只能从 gate0、feat/gate2-core 或 feat/gate2-5-native-tools 手动派发（当前 $GITHUB_REF）"
              exit 1
              ;;
          esac
          echo "部署目标：$target @ $GITHUB_SHA"
          test -f package-lock.json
          test -f worker/wrangler.jsonc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('worker/wrangler.jsonc', 'utf8');
          const cfg = raw.replace(/^\s*\/\/.*$/gm, '');
          for (const key of ['account_id', 'routes', 'route', 'd1_databases', 'kv_namespaces', 'r2_buckets', 'queues', 'hyperdrive']) {
            if (new RegExp('"' + key + '"\\s*:').test(cfg)) throw new Error('Forbidden Wrangler config key: ' + key);
          }
          if (!/"name"\s*:\s*"android-mcp-hub"/.test(cfg)) throw new Error('Unexpected Worker name');
          for (const cls of ['PhoneSession', 'McpSession', 'OAuthStore', 'GatewayStore']) {
            if (!cfg.includes('"' + cls + '"')) throw new Error('Missing Durable Object class: ' + cls);
          }
          if (!/"GATEWAY_ENABLED"\s*:\s*"true"/.test(cfg)) throw new Error('GATEWAY_ENABLED must be true for this deployment');
          if (!/"GATEWAY_ALLOWED_URLS"\s*:\s*"https:\/\//.test(cfg)) throw new Error('GATEWAY_ALLOWED_URLS must contain an exact https endpoint');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Run Gate 1 checks
        run: |
          npm run typecheck
          npm run test
          npm run e2e

      - name: Wrangler dry-run
        run: npx wrangler deploy --config worker/wrangler.jsonc --dry-run

      - name: Check required credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ "$CF_ACCOUNT" =~ ^[0-9a-fA-F]{32}$ ]] || { echo '::error::Invalid CLOUDFLARE_ACCOUNT_ID format'; exit 1; }

      - name: Deploy Worker
        if: ${{ !inputs.verify_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.jsonc

      # 只新增/轮换这一枚配对 Secret；其余 Secret（设备令牌、OAuth、上游密钥）
      # 由 Cloudflare 保留，wrangler deploy 不会动它们。
      - name: Configure Android pairing secret
        if: ${{ !inputs.verify_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAIRING_CODE: ${{ secrets.GATEWAY_ANDROID_PAIRING_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAIRING_CODE" || { echo '::error::Missing GATEWAY_ANDROID_PAIRING_CODE repository secret'; exit 1; }
          printf '%s' "$PAIRING_CODE" | npx wrangler secret put GATEWAY_ANDROID_PAIRING_CODE --config worker/wrangler.jsonc

      - name: Online gateway acceptance (real deployment)
        env:
          GATEWAY_BASE_URL: https://android-mcp-hub.causticrry.workers.dev
          GATEWAY_ANDROID_PAIRING_CODE: ${{ secrets.GATEWAY_ANDROID_PAIRING_CODE }}
          SMOKE_BENCH_SAMPLES: ${{ inputs.bench_samples }}
        run: node --import tsx tools/gateway-online-smoke.ts
