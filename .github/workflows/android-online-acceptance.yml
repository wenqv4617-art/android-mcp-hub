# Android 线上闭环验收：用 APK 里同一份 Kotlin 代码连真实的公网 Worker。
#
#   pair → 添加服务 → 服务端发现工具 → 授权只读工具 → 通过 /mcp 真实调用 → 清理
#
# 它和 `deploy-worker.yml` 里的 `tools/gateway-online-smoke.ts` 分工不同：
#   * smoke 用官方 Node SDK，验证**服务端**契约；
#   * 这个工作流用 Android 的 OkHttp / GatewayState / McpTransportFactory，
#     验证**手机侧真正会打包进 APK 的那段代码**能走通同一条链路。
#
# 只有 workflow_dispatch；不部署、不改任何线上配置，唯一的写操作是
# 用配对码创建一条 CI 服务并在结束时删除它。
name: Android online acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-loop:
    name: Android 客户端 ↔ 线上网关
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装 Android 35 平台与构建工具
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      # 同 APK 工作流：aapt2 覆盖是给 aarch64 主机的，x86_64 runner 必须关掉。
      - name: 关闭 aarch64 专用的 aapt2 覆盖
        run: |
          sed -i 's|^android\.aapt2FromMavenOverride=.*|# (CI) aapt2 override disabled: x86_64 runner uses the Maven one|' android/gradle.properties

      - name: 检查配对码
        env:
          PAIRING_CODE: ${{ secrets.GATEWAY_ANDROID_PAIRING_CODE }}
        run: |
          test -n "$PAIRING_CODE" || { echo '::error::Missing GATEWAY_ANDROID_PAIRING_CODE repository secret'; exit 1; }

      - name: 运行 Android 线上验收
        working-directory: android
        env:
          GATEWAY_BASE_URL: https://android-mcp-hub.causticrry.workers.dev
          GATEWAY_ANDROID_PAIRING_CODE: ${{ secrets.GATEWAY_ANDROID_PAIRING_CODE }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests "com.androidmcphub.app.gateway.GatewayOnlineAcceptanceTest"

      - name: 输出验收结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          paths = glob.glob('android/app/build/test-results/testDebugUnitTest/*GatewayOnlineAcceptanceTest*.xml')
          if not paths:
              print('::error::没有找到验收测试结果（测试可能没执行）')
              sys.exit(1)
          failed = False
          for path in paths:
              root = ET.parse(path).getroot()
              print(f"tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')} skipped={root.get('skipped')} time={root.get('time')}s")
              for case in root.iter('testcase'):
                  for tag in ('failure', 'error', 'skipped'):
                      node = case.find(tag)
                      if node is not None:
                          print(tag.upper(), (node.get('message') or '')[:500])
                          failed = True
              for out in root.iter('system-out'):
                  text = (out.text or '').strip()
                  if text:
                      print(text[-2000:])
          if failed:
              sys.exit(1)
          PY
