# ============================================================================
#  Version Catalog —— android/ 工程唯一的版本号来源
#
#  版本组合来自 /root/FocusSupervisor/gradle/libs.versions.toml（已验证兼容），
#  刻意只取本工程需要的那几项，不多引一个无关依赖。
# ============================================================================

[versions]
# ---- 构建工具链 ----------------------------------------------------------
# AGP 8.7.x 需要 Gradle 8.9+ 与 JDK 17；本机是 Gradle 8.11.1 + JDK 17，匹配。
agp = "8.7.3"
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一起发布，不需要再手动对齐
# kotlinCompilerExtensionVersion —— 这是选 2.0.21 的主要原因。
kotlin = "2.0.21"

# ---- AndroidX / Compose ---------------------------------------------------
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# BOM 统一 Compose 全家桶版本，下面的 compose-* 依赖都不写版本号。
composeBom = "2024.12.01"
coroutines = "1.9.0"
# Navigation Compose：UI 改版（四页 + 子页路由）唯一新引的依赖。
# 2.8.5 与 Compose BOM 2024.12.01（Compose 1.7.6）同期，是稳定版。
navigation = "2.8.5"

# ---- 网络 -----------------------------------------------------------------
# OkHttp：只用来做 WebSocket 客户端。没有引 Retrofit —— 本工程没有 REST 接口。
okhttp = "4.12.0"

# ---- 测试 -----------------------------------------------------------------
junit = "4.13.2"
# org.json 在 Android 上是系统内置实现（android.jar 里是抛异常的 stub），
# JVM 单元测试必须补一份真实现，否则 parseIncoming 的用例会报
# "Method put in org.json.JSONObject not mocked"。
json = "20240303"
# MockWebServer：在 JVM 上起一个假的 WebSocket 服务端，用来验证
# 「建连 → 发 hello → 收 phone_ping → 回 phone_pong → 断开」这条真实链路，
# 不需要模拟器。
mockwebserver = "4.12.0"
# Robolectric：在 JVM 上跑真实的 Android 框架（不需要模拟器/真机）。
# Stage 2 用它来验证导航返回栈 —— 这是本轮唯一一个用纯 JVM 逻辑测覆盖不了的
# 故障面（"点首页进了工具页"就是返回栈记账问题，不是决策函数问题）。
robolectric = "4.14.1"
# androidx.test 的 AndroidJUnit4 runner（Robolectric 测试的入口）。
androidxTestJunit = "1.2.1"

# ---- 本项目自身 -----------------------------------------------------------
# V1.6：签名固定 + 三层工具发现（Catalog / Guide / Execute）。
# versionCode 只在正式交付 APK 上递增；debug 构建用 versionNameSuffix "-debug" 区分。
appVersionName = "1.6.1"
appVersionCode = "7"

[libraries]
# ---- AndroidX 基础 --------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Compose（版本全部由 BOM 提供）----------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Navigation Compose：四页底部导航 + 子页路由 + 系统返回键行为。
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ---- 协程 / 网络 -----------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- 测试 -----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
# 见 [versions].json 的说明：给 JVM 单测提供真的 org.json 实现。
org-json = { group = "org.json", name = "json", version.ref = "json" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# ---- Compose UI 测试（在 JVM 上跑，靠 Robolectric 提供 Android 框架）--------
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
