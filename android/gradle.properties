# ---------------------------------------------------------------------------
# Gradle 构建参数
# ---------------------------------------------------------------------------

# 构建机器内存有限（容器内可用内存约 4GB），堆开大反而会被 OOM Killer 干掉。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# 只有一个模块，并行构建没有收益，只会多占内存。
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX / Kotlin 官方推荐开关
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 不启用 configuration-cache：AGP 8.7.3 支持，但骨架阶段没必要引入额外变量。

# ---------------------------------------------------------------------------
# aarch64 主机适配：AGP 默认下载的 aapt2 是 x86_64 可执行文件，在 aarch64 内核上
# 无法直接运行（"Daemon startup failed"）。这里指向一个包装脚本，用 qemu-user 在
# x86_64 sysroot 下运行 build-tools 自带的 aapt2。
# 真正的 x86_64 主机上构建时，删掉下面这一行即可（详见 README-ANDROID.md）。
# ---------------------------------------------------------------------------
android.aapt2FromMavenOverride=/root/android-mcp-hub/android/tools/aapt2
